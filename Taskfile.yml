version: "3"

vars:
  DC_FILE: "docker/compose.yml"
  REGISTRY: "docker.io"
  IMAGE_NAME: "sivaprasadreddy/spring-blog-api"
  DOCKER_IMAGE_NAME: "{{.REGISTRY}}/{{.IMAGE_NAME}}"
  VERSION:
    sh: "./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout"

tasks:
  default:
    cmds:
      - task: test

  help:
    cmds:
      - task --list
    silent: true

  format:
    desc: Formats code
    cmds:
      - "./mvnw spotless:apply"

  test:
    desc: Run all the tests
    deps: [ format ]
    cmds:
      - "./mvnw clean test -Dsurefire.skipAfterFailureCount=1"

  verify:
    desc: Run verification checks
    cmds:
      - "./mvnw -ntp verify"

  build_image:
    desc: Build Docker Image using Buildpacks
    cmds:
      - "./mvnw clean compile spring-boot:build-image -DskipTests -DdockerImageName={{.DOCKER_IMAGE_NAME}}:{{.VERSION}}"

  push_image:
    desc: Push Docker Image to Registry
    cmds:
      - task: build_image
      - docker tag {{.DOCKER_IMAGE_NAME}}:{{.VERSION}} {{.DOCKER_IMAGE_NAME}}:latest
      - docker push {{.DOCKER_IMAGE_NAME}}:{{.VERSION}}
      - docker push {{.DOCKER_IMAGE_NAME}}:latest

  start:
    desc: Start the application
    deps: [ build_image ]
    cmds:
      - docker compose -f "{{.DC_FILE}}" up --force-recreate -d

  stop:
    desc: Stop the application
    cmds:
      - docker compose -f "{{.DC_FILE}}" stop
      - docker compose -f "{{.DC_FILE}}" rm -f

  restart:
    desc: Restarts the application
    cmds:
      - task: stop
      - task: sleep
      - task: start

  sleep:
    desc: Sleeps for the given number of seconds
    vars:
      DURATION: "{{default 5 .DURATION}}"
    cmds:
      - "sleep {{.DURATION}}"
