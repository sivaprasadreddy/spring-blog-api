name: "spring-blog-api"
services:
  axelix:
    image: ghcr.io/axelixlabs/axelix:1.0.2
    container_name: axelix
    ports:
      - "9444:8080"
    environment:
      # Important: change for production use
      AXELIX_MASTER_AUTH_JWT_ALGORITHM: HMAC256
      AXELIX_MASTER_AUTH_JWT_SIGNING_KEY: 8DrZJSOJ8vkbxdjUB3sSsyeiG4Xidf1sDNmJq1Slkkn
    restart: unless-stopped

  spring-blog-api:
    image: sivaprasadreddy/spring-blog-api
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://blog-db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EMAIL_HOST: mailpit
      AXELIX_SBS_DISCOVERY_SELF_REGISTRATION: true
      AXELIX_SBS_DISCOVERY_INSTANCE_NAME: spring-blog-api
      AXELIX_SBS_DISCOVERY_INSTANCE_ACTUATOR_URL: http://spring-blog-api:8080/actuator
      #AXELIX_SBS_DISCOVERY_MASTER_URL: http://localhost:9444/api/internal/service/register
      AXELIX_SBS_DISCOVERY_MASTER_URL: http://axelix:8080/api/internal/service/register
    ports:
      - "8080:8080"
      - "5005:5005"
    restart: unless-stopped
    depends_on:
      - blog-db
      - mailpit

  blog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"
